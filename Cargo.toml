[workspace]
members = ["crates/core", "crates/ffi", "crates/windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/naviapps/desktop-actions"
rust-version = "1.99"

[workspace.dependencies]
desktop-applications = { git = "https://github.com/naviapps/desktop-applications.git", rev = "a76e43b45321fc80972876eca725115b627f0e5f" }
desktop-applications-windows = { git = "https://github.com/naviapps/desktop-applications.git", rev = "a76e43b45321fc80972876eca725115b627f0e5f" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
window-management = { git = "https://github.com/naviapps/window-management.git", rev = "4703b68005ba34ee9f16988606975eafb7d7752a" }
window-management-windows = { git = "https://github.com/naviapps/window-management.git", rev = "4703b68005ba34ee9f16988606975eafb7d7752a" }

[profile.release]
lto = "thin"
codegen-units = 1
