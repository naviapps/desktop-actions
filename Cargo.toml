[workspace]
members = ["crates/core", "crates/ffi", "crates/windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/naviapps/desktop-actions"
rust-version = "1.99"

[workspace.dependencies]
desktop-applications = { git = "https://github.com/naviapps/desktop-applications.git", rev = "1ddfee787a940ee6ca964ec28922868910b90ac5" }
desktop-applications-windows = { git = "https://github.com/naviapps/desktop-applications.git", rev = "1ddfee787a940ee6ca964ec28922868910b90ac5" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
window-management = { git = "https://github.com/naviapps/window-management.git", rev = "06463118a74029a57038c4e614e36a429b2516ae" }
window-management-windows = { git = "https://github.com/naviapps/window-management.git", rev = "06463118a74029a57038c4e614e36a429b2516ae" }

[profile.release]
lto = "thin"
codegen-units = 1
