[workspace]
members = ["crates/core", "crates/ffi", "crates/windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/naviapps/desktop-actions"
rust-version = "1.99"

[workspace.dependencies]
desktop-applications = { git = "https://github.com/naviapps/desktop-applications.git", rev = "4ea3b7ed9d22adcfac05a42fc98e826467dbea90" }
desktop-applications-windows = { git = "https://github.com/naviapps/desktop-applications.git", rev = "4ea3b7ed9d22adcfac05a42fc98e826467dbea90" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
window-management = { git = "https://github.com/naviapps/window-management.git", rev = "34bf9d3bc5c7079b283f763296fea9bc0eed020b" }
window-management-windows = { git = "https://github.com/naviapps/window-management.git", rev = "34bf9d3bc5c7079b283f763296fea9bc0eed020b" }

[profile.release]
lto = "thin"
codegen-units = 1
