name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform checks to run
        type: choice
        default: all
        options: [all, macos, windows]
      native-aot:
        description: Publish and run the win-x64 Native AOT NuGet consumer
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.ref }}-${{ inputs.native-aot && 'native-aot' || inputs.platform || 'all' }}
  cancel-in-progress: true
jobs:
  plan:
    if: ${{ !inputs.native-aot }}
    uses: naviapps/sdk-tooling/.github/workflows/plan-checks.yml@5b8ed6b1de70b0d7f0cf78519fd9fb1cbdf1f11a
  swift:
    name: Swift
    needs: plan
    if: ${{ needs.plan.outputs.documentation-only != 'true' && inputs.platform != 'windows' }}
    uses: naviapps/sdk-tooling/.github/workflows/check-swift.yml@5b8ed6b1de70b0d7f0cf78519fd9fb1cbdf1f11a
  windows:
    name: Test Rust
    needs: plan
    if: ${{ needs.plan.outputs.documentation-only != 'true' && inputs.platform != 'macos' }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: naviapps/sdk-tooling/.github/actions/test-rust-windows@888bf13f109ac7dc806b29478cc9c4acacdf6515
  native-aot:
    name: Run Native AOT NuGet consumer
    if: inputs.native-aot
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GIT_TERMINAL_PROMPT: "0"
    defaults:
      run:
        shell: pwsh
        working-directory: sdk
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          path: sdk
          persist-credentials: false
      - name: Check out SDK Tooling for the Native AOT check
        uses: actions/checkout@v6.1.0
        with:
          repository: naviapps/sdk-tooling
          ref: c80aebadffbab8d09a14456e987db5ad273f6879
          path: sdk-tooling
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.1"
          architecture: x64
      - name: Install pinned x64 .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: sdk/global.json
          architecture: x64
      - name: Install pinned Rust
        run: rustup install --no-self-update
      - name: Verify the x64 packages and publish the Native AOT consumer
        run: python -I -B ../sdk-tooling/ci/run_sdk_tooling.py windows -m distribution.verify_windows --native-aot
