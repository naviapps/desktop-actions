name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform checks to run
        type: choice
        default: all
        options: [all, macos, windows]
      native-aot:
        description: Publish and run the win-x64 Native AOT NuGet consumer
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.event_name == 'push' && github.run_id || github.ref }}-${{ inputs.native-aot && 'native-aot' || inputs.platform || 'all' }}
  cancel-in-progress: true
jobs:
  check:
    uses: naviapps/sdk-tooling/.github/workflows/check-sdk.yml@fd6410ecc7b907d524d50077f2750b7bfed5bf37
    with:
      platform: ${{ inputs.platform || 'all' }}
      windows: rust
      native-aot: ${{ inputs.native-aot == true }}
