[package]
name = "desktop-actions-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
desktop-actions = { path = "../core" }
desktop-applications.workspace = true
desktop-applications-windows.workspace = true
window-management-windows.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
# ShellExecuteExW requires Registry because SHELLEXECUTEINFOW contains an HKEY.
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
] }
