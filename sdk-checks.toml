[swift]
inputs = ["Package.swift", "Sources", "Tests", "Artifacts", "ThirdParty"]
executable = "DesktopActionsConsumer"

[rust_c]
git_url = "https://github.com/naviapps/desktop-actions.git"
rust_packages = ["desktop-actions"]
rust_git_dependencies = ["window-management"]

[rust_c.c]
framework = "Artifacts/CDesktopActions.xcframework/macos-arm64_x86_64/CDesktopActions.framework"
header = "desktop_actions.h"

[bindings]
abi_fixture = "crates/ffi/tests/c/abi.c"
dotnet_project = "bindings/dotnet/tests/DesktopActions.Tests/DesktopActions.Tests.csproj"

[nuget]
package_id = "NaviApps.DesktopActions"
fixtures = [
  "fixtures/consumers/dotnet/PackageConsumer.cs",
  "fixtures/consumers/dotnet/ReflectionFreeConsumer.cs",
]
