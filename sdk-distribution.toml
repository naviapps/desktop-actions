[macos]
commands = [
  ["xcrun", "swift", "--version"],
  ["cargo", "fetch", "--locked"],
  ["make", "check-distribution", 'SDK_TOOLING=python3 -I -B "{tooling}/tasks/sdk"'],
  ["git", "clone", "https://github.com/naviapps/window-management.git", "{temp}/window-management"],
  [
    "python3",
    "-I",
    "-B",
    "{tooling}/tasks/sdk",
    "installed-consumers",
    "--git-dependency-source",
    "naviapps/window-management={temp}/window-management",
  ],
  ["python3", "-I", "-B", "{tooling}/tasks/sdk", "swift-consumer", "--distribution"],
]

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  ["cargo", "fmt", "--all", "--", "--check"],
  [
    "python",
    "-I",
    "-B",
    "{tooling}/tasks/sdk",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "fixtures/distribution/tests",
  ],
  [
    "python",
    "-I",
    "-B",
    "{tooling}/tasks/sdk",
    "windows",
    "fixtures/distribution/check-windows.py",
  ],
]
